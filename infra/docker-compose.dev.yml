networks:
  # Private internal network — no service is directly reachable from outside
  # except Nginx (which gets the only public-facing port: 80).
  # This closes the IP spoofing attack vector: attackers cannot reach the
  # Node.js API directly to inject a fake X-Forwarded-For header.
  internal:
    driver: bridge

services:
  # ═══════════════════════════════════════
  # PostgreSQL PRIMARY & REPLICA (Simulated)
  # ═══════════════════════════════════════
  pg-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    # No external ports — only reachable inside the internal network
    expose:
      - "5432"
    networks:
      - internal
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U urlshortener" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════
  # Redis (Cache + Rate Limiting)
  # ═══════════════════════════════════════
  redis:
    image: redis:7-alpine
    # No external ports — only reachable inside the internal network
    expose:
      - "6379"
    networks:
      - internal
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ═══════════════════════════════════════
  # RabbitMQ (Message Queue for Analytics)
  # ═══════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"         # AMQP (dev convenience — remove in production)
      - "127.0.0.1:15672:15672" # Management UI bound to localhost only
    networks:
      - internal
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  pgdata_primary:
  pgdata_replica:
  redisdata:
  rabbitmqdata:
